<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    DeepListener app icon.

    Design constraints:
    macOS Dock shows the raw PNG WITHOUT applying an iOS-style rounded mask.
    A full-bleed square looks like a giant slab, so we keep the colored
    plate smaller than the canvas (about 78% with transparent padding) which
    lets the Dock's own rounded background show through.

    The rounded plate (indigo gradient) is the brand color already used
    in globals.css (primary, approx indigo-600).

    Motif: headphones + sound wave = listening. Kept simple so it reads
    at 32px (Dock) and 512px alike.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Rounded plate centered with ~11% transparent padding on all sides. -->
  <rect x="56" y="56" width="400" height="400" rx="96" ry="96" fill="url(#plate)"/>

  <!-- Headphone band: a thick arc over the top. -->
  <path
    d="M 168 272 Q 168 168 256 168 Q 344 168 344 272"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- Left ear cup. -->
  <rect x="140" y="268" width="56" height="92" rx="28" ry="28" fill="#ffffff"/>
  <!-- Right ear cup. -->
  <rect x="316" y="268" width="56" height="92" rx="28" ry="28" fill="#ffffff"/>

  <!-- Sound wave bars between the ear cups, rising then falling. -->
  <g fill="#c7d2fe">
    <rect x="226" y="284" width="14" height="40" rx="7"/>
    <rect x="249" y="268" width="14" height="72" rx="7"/>
    <rect x="272" y="284" width="14" height="40" rx="7"/>
  </g>
</svg>
