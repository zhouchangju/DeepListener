<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DeepListener sentence-level listening workflow</title>
  <desc id="desc">A product preview showing a waveform and the steps Blind listen, Mark the gap, and Shadow it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <text x="80" y="100" fill="#312e81" font-family="Arial, sans-serif" font-size="34" font-weight="700">DeepListener</text>
  <text x="80" y="154" fill="#475569" font-family="Arial, sans-serif" font-size="26">Decode the sentence you missed.</text>
  <rect x="80" y="205" width="1040" height="250" rx="26" fill="#1e1b4b"/>
  <g fill="#a5b4fc">
